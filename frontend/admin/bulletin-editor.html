<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTUOS Admin — Editor de Boletim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="/admin/css/global.css" />
    <link rel="stylesheet" href="/admin/css/components.css" />
    <link rel="stylesheet" href="/admin/css/forms.css" />
    <link rel="stylesheet" href="/admin/css/layout.css" />
</head>
<body>

    <header class="admin-header">
        <div class="container">
            <div class="admin-header-left">
                <a href="/admin" class="admin-logo">
                    CTU<span>OS</span>
                    <span class="admin-badge">Admin</span>
                </a>

                <nav class="admin-nav">
                    <a href="/admin">Dashboard</a>
                    <a href="/admin/reports">Denúncias</a>
                    <a href="/admin/bulletins" class="active">Boletins</a>
                    <a href="/admin/statistics">Estatísticas</a>
                    <a href="/admin/settings">Configurações</a>
                </nav>
            </div>

            <div class="admin-header-right">
                <a href="/" class="btn-admin ghost sm" target="_blank">
                    <i class="fa-solid fa-external-link-alt"></i> Ver site
                </a>

                <div class="admin-user">
                    <div class="admin-user-avatar" id="adminAvatar">A</div>
                    <span class="admin-user-name" id="adminName">Admin</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <div class="container">
                <h1 id="editorTitle">📝 Criar Boletim</h1>
                <p>Publique um novo alerta ou notícia</p>
            </div>
        </div>

        <section class="admin-page">
            <div class="container">
                <form id="bulletinForm" enctype="multipart/form-data">
                    <div class="editor-grid">

                        <!-- COLUNA PRINCIPAL -->
                        <div class="editor-main">
                            <div class="form-group-admin">
                                <label for="editTitle">Título <span class="required">*</span></label>
                                <input type="text" id="editTitle" placeholder="Título do boletim" required />
                            </div>

                            <div class="form-group-admin">
                                <label for="editSubtitle">Subtítulo</label>
                                <input type="text" id="editSubtitle" placeholder="Subtítulo (opcional)" />
                            </div>

                            <div class="form-group-admin">
                                <label for="editExcerpt">Resumo</label>
                                <textarea id="editExcerpt" placeholder="Resumo curto para exibição nos cards" rows="3"></textarea>
                            </div>

                            <div class="form-group-admin">
                                <label for="editContent">Conteúdo <span class="required">*</span></label>
                                <textarea id="editContent" placeholder="Conteúdo completo do boletim (aceita HTML)" rows="14" required></textarea>
                            </div>
                        </div>

                        <!-- COLUNA LATERAL -->
                        <div class="editor-sidebar">
                            <div class="form-group-admin">
                                <label for="editCategory">Categoria</label>
                                <select id="editCategory">
                                    <option value="outros">Outros</option>
                                    <option value="whatsapp">WhatsApp</option>
                                    <option value="pix">PIX</option>
                                    <option value="marketplace">Marketplace</option>
                                    <option value="emprego">Emprego</option>
                                    <option value="instagram">Instagram</option>
                                    <option value="telegram">Telegram</option>
                                </select>
                            </div>

                            <div class="form-group-admin">
                                <label for="editSeverity">Severidade</label>
                                <select id="editSeverity">
                                    <option value="low">Baixo</option>
                                    <option value="medium">Médio</option>
                                    <option value="high">Alto</option>
                                    <option value="critical">Crítico</option>
                                </select>
                            </div>

                            <div class="form-group-admin">
                                <label for="editReadingTime">Tempo de Leitura (min)</label>
                                <input type="number" id="editReadingTime" value="5" min="1" max="60" />
                            </div>

                            <div class="form-group-admin">
                                <label for="editTags">Tags (separadas por vírgula)</label>
                                <input type="text" id="editTags" placeholder="Ex: pix, phishing, golpe" />
                            </div>

                            <div class="form-group-admin">
                                <label>Banner</label>
                                <div class="file-upload-admin">
                                    <label class="file-label" for="bannerInput">
                                        <i class="fa-solid fa-cloud-upload-alt"></i> Escolher imagem
                                    </label>
                                    <input type="file" id="bannerInput" accept="image/*" style="display:none;" />
                                    <span class="file-name" id="bannerName">Nenhum arquivo</span>
                                </div>
                                <div id="currentBanner" style="margin-top:0.5rem;"></div>
                                <div id="bannerPreview" style="margin-top:0.5rem;"></div>
                            </div>

                            <div class="form-actions-admin">
                                <button type="submit" class="btn-admin primary block" id="submitBtn">
                                    <i class="fa-solid fa-check"></i> Publicar
                                </button>
                                <a href="/admin/bulletins" class="btn-admin block">
                                    Cancelar
                                </a>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer-admin">
        <div class="footer-brand">CTU<span>OS</span> — Painel Administrativo</div>
        <div>© <span id="footerYear"></span> CTUOS. Todos os direitos reservados.</div>
    </footer>

    <script src="/admin/js/admin-guard.js"></script>
    <script src="/admin/js/cmsApi.js"></script>
    <script src="/admin/js/bulletinEditor.js"></script>
    <script>
        document.getElementById('footerYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
