<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - CTUOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/pages/forms.css" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <a href="/" class="logo">CTU<span>OS</span></a>
                <p>Entre para acessar sua conta</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="error-message" id="loginError">Credenciais inválidas.</div>
                <div class="form-group">
                    <label for="loginIdentifier">E-mail ou usuário <span class="required">*</span></label>
                    <input type="text" id="loginIdentifier" placeholder="exemplo@email.com ou @usuario" required />
                </div>
                <div class="form-group">
                    <label for="loginPassword">Senha <span class="required">*</span></label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Entrar</button>
                </div>
                <div class="auth-footer">
                    <a href="#" id="forgotPasswordBtn">Esqueceu a senha?</a>
                    <br />
                    Não tem conta? <a href="/conta/cadastro.html">Crie uma agora</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
